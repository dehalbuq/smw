name: SMW Android TV ARMv7 Release v8 Latest v7 Engine

on:
  push:
    branches: [release/android-tv-armv7-v8]
    paths:
      - tools/port_android_armv7.py
      - tools/gen_android_tv_banner.py
      - tools/patch_android_projector.py
      - tools/android_quit_menu.c
      - tools/android_quit_menu.h
      - tools/test_android_quit_menu.py
      - .github/workflows/build-android-armv7.yml
      - src/**
      - assets/smw_assets.h
  workflow_dispatch:

jobs:
  armv7-release-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout native SMW engine
        uses: actions/checkout@v4
      - name: JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install ARMv7 NDK and Android 31 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-31' 'build-tools;31.0.0' 'ndk;25.2.9519653'
      - name: Regression check for vertical-pipe horizontal velocity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path('src/smw_00.c').read_text()
          expected = 'player_xspeed = (v0 < 2) ? kPlayerStateXX_EnterPipe_PipeXSpeed[v0] : 0;'
          assert expected in code, 'Vertical pipes must not read beyond PipeXSpeed[2]'
          import re
          assert re.search(r'kPlayerStateXX_EnterPipe_PipeXSpeed\[2\]', code)
          assert re.search(r'kPlayerStateXX_EnterPipe_PipeYSpeed\[4\]', code)
          print('Pipe actions 0/1: horizontal velocity; 2/3: horizontal speed zero')
          PY
      - name: Verify growing and shrinking poses and full-frame policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          c = Path("src/smw_00.c").read_text()
          for array in ("kPlayerGFXRt_PlayerXYDispIndexIndex",
                        "kPlayerGFXRt_DATA_00E18E"):
            match = re.search(rf"static const uint8 {array}\[71\]\s*=\s*\{{([^}}]+)\}}", c)
            assert match, f"Missing 71-entry pose table: {array}"
            values = re.findall(r"0x[0-9a-fA-F]+|(?<![a-zA-Z0-9])\d+", match.group(1))
            assert len(values) == 71, (array, len(values))
            assert int(values[70], 0) == 0, (array, values[70])
          patch = Path("tools/patch_android_projector.py").read_text()
          assert "g_snes->disableRender = false;" in patch
          assert "DrawPpuFrameWithPerf();" in patch
          print("OK: pose 70 tables bounded, all game frames will be drawn")
          PY
      - name: Verify native START SELECT exit menu wiring
        run: |
          python3 -m py_compile tools/port_android_armv7.py tools/patch_android_projector.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          c=Path('tools/android_quit_menu.c').read_text()
          h=Path('tools/android_quit_menu.h').read_text()
          p=Path('tools/patch_android_projector.py').read_text()
          b=Path('tools/port_android_armv7.py').read_text()
          assert "AndroidQuitMenu_Poll(" in c and "AndroidQuitMenu_IsOpen" in c
          assert "SDL_JoystickGetButton(joy, 4)" in p
          assert "SDL_JoystickGetButton(joy, 6)" in p
          assert "AndroidQuitMenu_WantsExit()" in p
          assert "AndroidQuitMenu_Draw(pixel_buffer" in p
          assert "g_snes->disableRender = false;" in p
          assert "android_quit_menu.c" in b and "android_quit_menu.h" in b
          assert "START = SAIR" in c and "SELECT = VOLTAR" in c
          assert "void AndroidQuitMenu_Draw" in h
          print("Android exit menu wired; render/asset/gamepad baselines intact")
          PY
      - name: Test exit menu reset across repeated Android launches
        run: |
          python3 tools/test_android_quit_menu.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path("tools/android_quit_menu.c").read_text()
          header = Path("tools/android_quit_menu.h").read_text()
          patch = Path("tools/patch_android_projector.py").read_text()
          assert "void AndroidQuitMenu_Reset(void)" in source
          assert "void AndroidQuitMenu_Reset(void)" in header
          assert patch.count("AndroidQuitMenu_Reset();") >= 2
          assert "Smw_ClosePad(player);" in patch
          assert "g_win_flags = SDL_WINDOW_RESIZABLE;" in patch
          print("OK: new native main resets exit request and SDL controller handles")
          PY
      - name: Regression checks for cold boot and persistent save slots
        run: |
          python3 -m py_compile tools/patch_android_projector.py tools/port_android_armv7.py
          python3 tools/test_android_quit_menu.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tools/patch_android_projector.py").read_text()
          b=Path("tools/port_android_armv7.py").read_text()
          assert 'memset(g_ram, 0, sizeof(g_ram));' in p
          assert '#include "common_rtl.h"' in p
          assert 'SDL_AndroidGetExternalStoragePath()' in p
          assert 'chdir(smw_storage)' in p
          assert 'SaveGame();' in b
          assert 'rw(dst/"smw_00.c"' in b
          assert 'rw(dst/"smw_04.c"' in b
          assert 'AndroidQuitMenu_Reset();' in p
          print("OK: RAM reset, persistent Android data dir and nonempty save slots")
          PY
      - name: Prepare 32-bit SMW engine and SDL2 frontend
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/freyta/smw-android.git android-base
          python3 tools/port_android_armv7.py android-base .
          grep -Fxq 'APP_ABI := armeabi-v7a' android-base/app/jni/Application.mk
          grep -Fxq 'APP_OPTIM := release' android-base/app/jni/Application.mk
          test ! -f android-base/app/src/main/assets/smw_assets.dat
      - name: Verify native Android TV launcher, banner, and ARMv7 release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import xml.etree.ElementTree as ET
          base = Path("android-base/app/src/main")
          manifest = ET.parse(base / "AndroidManifest.xml").getroot()
          a = "{http://schemas.android.com/apk/res/android}"
          features = manifest.findall("uses-feature")
          assert any(f.attrib.get(a + "name") == "android.software.leanback" and
                     f.attrib.get(a + "required") == "false" for f in features)
          assert any(f.attrib.get(a + "name") == "android.hardware.touchscreen" and
                     f.attrib.get(a + "required") == "false" for f in features)
          app = manifest.find("application")
          assert app.attrib.get(a + "banner") == "@drawable/tv_banner"
          activity = app.find("activity")
          categories = {c.attrib.get(a+"name") for x in activity.findall("intent-filter")
                        for c in x.findall("category")}
          assert "android.intent.category.LEANBACK_LAUNCHER" in categories
          assert "android.intent.category.LAUNCHER" in categories
          banner = base / "res/drawable-nodpi/tv_banner.png"
          png = banner.read_bytes()
          assert png[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", png[16:24]) == (320, 180)
          gradle = Path("android-base/app/build.gradle").read_text()
          assert "versionCode 8" in gradle and "versionName \"1.0.8-tv\"" in gradle
          assert "com.dehalbuq.smw" in gradle
          print("PASS Android TV 320x180 banner, leanback launcher, same app ID, release v8")
          PY
      - name: JDK 11 for upstream Gradle version
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build non-debuggable optimized ARMv7 unsigned Release APK
        working-directory: android-base
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Verify and collect base APK plus signing utilities
        run: |
          set -euo pipefail
          APK=android-base/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/armeabi-v7a/libmain.so'
          if unzip -Z1 "$APK" | grep -Eq 'lib/(arm64-v8a|x86|x86_64)/'; then
            echo 'Only ARMv7 is permitted' >&2; exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/SMW-ARMv7-Release-unsigned.apk
          BT="$ANDROID_HOME/build-tools/31.0.0"
          cp "$BT/zipalign" dist/zipalign
          cp "$BT/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/SMW-ARMv7-Release-unsigned.apk
      - name: Upload base Release APK without game assets
        uses: actions/upload-artifact@v4
        with:
          name: SMW-ARMv7-Release-base-and-signing
          path: dist/
          retention-days: 7
