name: "R36S - Testar GCC cruzado nativo x86_64 a ARM64"
on:
  workflow_dispatch:
  push:
    paths:
      - "cloud-kit/r36s/Dockerfile.cross-buster-x64"
      - "cloud-kit/r36s/toolchain-aarch64-buster.cmake"
      - ".github/workflows/r36s-cross-buster-preflight.yml"
permissions:
  contents: read
jobs:
  cross-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Buildar container de compilador cruzado Buster (sem ROM)
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -f cloud-kit/r36s/Dockerfile.cross-buster-x64 \
            -t smw-cross-buster:preflight cloud-kit/r36s
      - name: Testar ligacao C++17 std::filesystem com GCC 8 AArch64
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross-fs"
          cat > "$RUNNER_TEMP/cross-fs/probe.cpp" <<'CPP'
          #include <filesystem>
          #include <string>
          int main(int argc, char** argv) {
            auto p = std::filesystem::path(argc > 1 ? argv[1] : "/tmp");
            return std::filesystem::exists(p) ? 0 : 1;
          }
          CPP
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$RUNNER_TEMP/cross-fs,dst=/probe" \
            smw-cross-buster:preflight bash -euc '
              aarch64-linux-gnu-g++ -std=c++17 -O2 -o /probe/probe /probe/probe.cpp -lstdc++fs
              readelf -h /probe/probe | grep -q "Machine:.*AArch64"
              aarch64-linux-gnu-nm -D /probe/probe 2>/dev/null | grep -q "std" || true
              echo PASS_CXX17_FILESYSTEM_LINK_AARCH64_GCC8
            '
          echo 'PASS: GCC 8 ARM64 C++17 filesystem link via -lstdc++fs' >> "$GITHUB_STEP_SUMMARY"

      - name: Configurar motor real e compilar 15 modulos ARM64 SEM ROM
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/mstan/SuperMarioWorldRecomp.git "$RUNNER_TEMP/smw-cross-source"
          cd "$RUNNER_TEMP/smw-cross-source"
          git checkout --detach afc5850ff96ffc7edb63a31725cb5eeacae017bb
          git submodule update --init --recursive
          base64 --decode "$GITHUB_WORKSPACE/cloud-kit/EmuELEC48_Kit.tar.xz.b64" > "$RUNNER_TEMP/kit.tar.xz"
          echo "e1bb6235bd584df602f5850884937c4f9486f1b7d4cac49309f7c5844a516030  $RUNNER_TEMP/kit.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kit"
          tar -xJf "$RUNNER_TEMP/kit.tar.xz" -C "$RUNNER_TEMP/kit"
          cp -a "$RUNNER_TEMP/kit/tools/." ./tools/
          cp -a "$RUNNER_TEMP/kit/ports" ./ports
          python3 tools/apply_emuelec.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/port/gles2_renderer.c')
          s = p.read_text()
          marker = '&renderer_begin_draw, &renderer_end_draw,'
          if s.count(marker) != 1: raise SystemExit('GLES2 vtable changed')
          p.write_text(s.replace(marker, marker + '\n      NULL,', 1))
          PY
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$RUNNER_TEMP/smw-cross-source,dst=/src" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/port-code,readonly" \
            -e EMU_TOOLCHAIN_FILE=/port-code/cloud-kit/r36s/toolchain-aarch64-buster.cmake \
            smw-cross-buster:preflight \
            bash -c 'set -euo pipefail; git config --global --add safe.directory /src; git config --global --add safe.directory /src/snesrecomp; git config --global --add safe.directory /src/recomp-ui; bash /port-code/cloud-kit/tests/run_cmake_preflight.sh /src /src/build-r36s-cross-preflight; python3 /port-code/cloud-kit/tests/compile_host_objects.py /src/build-r36s-cross-preflight' \
            2>&1 | tee "$RUNNER_TEMP/cross-engine-preflight.log"
          grep -q 'PASS SMW_ARM64_HOST_OBJECTS' "$RUNNER_TEMP/cross-engine-preflight.log"
          echo 'PASS 15 cross AArch64 engine translation units, no ROM.' >> "$GITHUB_STEP_SUMMARY"
      - name: Compilar C e C++ ARM64 com SDL2 EGL GLES2 e validar GLIBC
        run: |
          set -euo pipefail
          mkdir -p /tmp/r36s-cross-check
          cat >/tmp/r36s-cross-check/probe.c <<'C'
          #include <SDL.h>
          #include <EGL/egl.h>
          #include <GLES2/gl2.h>
          #include <stdio.h>
          int main(void) {
            printf("SDL %d, EGL=%p, GLES=%p\n", SDL_MAJOR_VERSION,
                (void *)&eglGetDisplay, (void *)&glGetString);
            return 0;
          }
          C
          docker run --rm --platform linux/amd64 \
            --mount type=bind,src=/tmp/r36s-cross-check,dst=/check \
            smw-cross-buster:preflight bash -euc '
              set -o pipefail
              pkg-config --modversion sdl2 egl glesv2
              aarch64-linux-gnu-gcc -O2 -o /check/probe /check/probe.c \
                $(pkg-config --cflags --libs sdl2 egl glesv2)
              readelf -h /check/probe | grep -q "Machine:.*AArch64"
              readelf --version-info /check/probe > /check/abi.txt
              python3 - <<PY
          from pathlib import Path
          import re
          x=Path("/check/abi.txt").read_text()
          v=[tuple(map(int,m)) for m in re.findall(r"GLIBC_(\\d+)\\.(\\d+)",x)]
          print("MAX_GLIBC=",max(v))
          assert v and max(v)<=(2,30), "GLIBC too new"
          PY
              echo PASS_NATIVE_X64_TO_R36S_AARCH64
            '
          echo "PASS_NATIVE_X64_TO_R36S_AARCH64" >> "$GITHUB_STEP_SUMMARY"
