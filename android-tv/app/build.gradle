plugins { id 'com.android.application' }

android {
    namespace 'com.dehalbuq.smwrecomp'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dehalbuq.smwrecomp'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '0.1.0-tv-experimental'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DSMW_ANDROID_SOURCE=${System.getenv('SMW_ANDROID_SOURCE') ?: 'NOT_SET'}", 
                    "-DSMW_ANDROID_SDL2=${System.getenv('SMW_ANDROID_SDL2') ?: 'NOT_SET'}", 
                    "-DSMW_ANDROID_STUB=${System.getenv('SMW_ANDROID_STUB') ?: 'OFF'}", '-DANDROID_STL=c++_shared', '-DSMW_EMUELEC_GLES2=ON',
                    '-DSNESRECOMP_SDL_BACKEND=SDL2', '-DSMW_BUNDLE_FALCON_CACHE_HELPER=OFF',
                    '-DSMW_NETPLAY_ICE=OFF', '-DSNESRECOMP_ENABLE_LUA=OFF',
                    '-DSMW_ANDROID_TV=ON'
                cppFlags '-std=c++17'
            }
        }
    }
    ndkVersion '26.3.11579264'
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // private testing only
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}
