[General]
Autosave = 0
DisableFrameDelay = 0
SavePlaythrough = 1

[Graphics]
WindowSize = 640x480
Fullscreen = 1
WindowScale = 1
NewRenderer = 1
IgnoreAspectRatio = 1
NoSpriteLimits = 0
# Stable default: software rendering on 4:3 R36S screen
# Alternative optional test: OpenGLES2 (requires smw-gles2 and device EGL/GLES2)
OutputMethod = SDL-Software
# ViewportMode=16:9 only prepares a 16:9 display viewport (native 4:3 scene centered).
# It does NOT yet extend the level's visible world as in mstan's renderer.
ViewportMode = 4:3
LinearFiltering = 0

[Sound]
EnableAudio = 1
AudioFreq = 32000
AudioChannels = 2
AudioSamples = 1024

[GamepadMap]
EnableGamepad1 = true
EnableGamepad2 = false
Controls = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
