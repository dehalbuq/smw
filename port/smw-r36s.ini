[General]
Autosave = 0
DisableFrameDelay = 0
SavePlaythrough = 0

[Graphics]
WindowSize = 640x480
Fullscreen = 1
WindowScale = 1
NewRenderer = 1
IgnoreAspectRatio = 1
PixelPerfect = 1
VSync = 1
UseBackdrop = 1
BackgroundImage = background.png
NoSpriteLimits = 0
OutputMethod = OpenGLES2
LinearFiltering = 0

[Sound]
EnableAudio = 1
AudioFreq = 32000
AudioChannels = 2
AudioSamples = 1024

[GamepadMap]
EnableGamepad1 = true
EnableGamepad2 = false
Controls = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
